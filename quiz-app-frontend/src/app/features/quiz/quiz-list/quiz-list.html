    <app-navbar></app-navbar>

    <div class="dashboard-wrapper">

      <div class="quiz-container">
        <header class="dashboard-header">
          <div class="header-content">
          <div>
            <h1>Available Quizzes</h1>
          </div>

          <button
            class="create-btn"
            (click)="goToCreateQuiz()">
            ✨ Create Quiz
          </button>
        </div>

      </header>

        <div class="quiz-grid">
          @for (quiz of quizzes(); track quiz.id) {
            <div class="quiz-card">
              <div class="card-main">
                <div class="card-top-row">
                  <div class="mini-icon">⚡</div>
                  <span class="quiz-id-tag">#{{$index + 1}}</span>
                </div>

                <div class="card-info">
                  <h2>{{ quiz.title }}</h2>
                  <p>{{ quiz.description || 'No description available' }}</p>
                </div>
              </div>

              <div class="card-action-row">
                <div class="time-pill">
                  <span class="clock">⏱️</span>
                  <span>{{ quiz.durationInMinutes }}m</span>
                </div>

                <button class="action-btn" (click)="startQuiz(quiz.id)">
                  <span>Start</span>
                  <span class="arrow">➔</span>
                </button>
              </div>
            </div>
          }
        </div>
      </div>
    </div>
